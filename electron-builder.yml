# electron-builder configuration for the opencodex desktop app.
#
# Build:  npx --yes electron-builder@26 --win --publish never
#
# `electron` is deliberately NOT a devDependency of this repo. electron-builder
# downloads the runtime itself when `electronVersion` is pinned here, which keeps
# a ~100 MB download out of every existing CI job that runs `bun install`.
# Bump this line to move the desktop app to a newer Electron.
electronVersion: 43.2.0

appId: com.opencodex.desktop
productName: OpenCodex
# Keep the executable, shortcut target, and Squirrel identity stable while the
# human-facing product name uses the proper OpenCodex capitalization.
executableName: opencodex
copyright: MIT

# The published npm package keeps its own `name` and `main`; overriding them only
# in the packaged copy means the desktop build needs no changes to package.json.
extraMetadata:
  name: opencodex-desktop
  main: electron/main.mjs
  # NOTE: the `author` NuGet needs lives in `package.json`, not here.
  #
  # It was tried here first, because `extraMetadata` is merged into the packaged
  # copy and that keeps the npm package untouched. It does not work:
  # electron-builder computes its app metadata from the ORIGINAL `package.json`
  # before this merge is applied, so `nuget pack` still failed with "Authors is
  # required." — the same error, unchanged, which is what proved where the value
  # is actually read from.

directories:
  output: dist-desktop
  buildResources: assets

# asar is off on purpose — see the comment on ROOT in electron/main.mjs. The proxy
# is Bun reading TypeScript off disk and exec'ing a bundled bun binary; neither
# survives being packed into an archive.
asar: false

files:
  - electron/**
  - bin/**
  - src/**
  - gui/dist/**
  - package.json
  # Only these two — not the whole scripts/ directory, most of which is
  # release/dev tooling nobody runs from an installed app. electron/cli-path.mjs
  # shells out to ensure-desktop-cli-path.ps1 (which dot-sources
  # install-path.ps1) during --squirrel-install / --squirrel-updated to put
  # `ocx` on PATH, reusing the exact same PATH-repair functions
  # scripts/install.ps1 (the npm installer) already has tests for, rather than
  # a second PATH-writing mechanism that only the desktop app has.
  - scripts/install-path.ps1
  - scripts/ensure-desktop-cli-path.ps1
  # Written by CI immediately before packaging. Its absence is not a build
  # failure — a local `electron-builder` run has no run number to stamp — and the
  # readers all fall back to "dev" rather than guessing. See
  # electron/build-stamp.mjs.
  - build-info.json
  # The COMPLETE production node_modules tree, not an allowlist. The first draft
  # enumerated top-level deps and missed @modelcontextprotocol/sdk's transitive
  # tree (express, hono, ajv, jose, ~40 packages) — the installed app would have
  # crashed the moment MCP code loaded. The CI workflows run
  # `bun install --production` immediately before packaging, so this glob picks
  # up exactly the runtime tree and nothing dev-only. The target machine needs
  # NOTHING preinstalled: no Node, no npm, no Bun — Electron's own Node runs
  # bin/ocx.mjs, and the bundled bun binary runs the proxy.
  - node_modules/**
  # Nothing below is needed at runtime and all of it is large.
  - "!**/*.map"
  - "!**/*.md"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"

# Windows is the only supported desktop target. macOS and Linux targets were
# removed deliberately rather than left half-configured — a target that is
# declared but never built is a promise the project is not keeping.
#
# If a platform is added back later, note that the desktop app must not become
# the place where features diverge: anything that works on another OS has to work
# on Windows too. See docs/design-system/m3-port-handoff.md, "Platform support".
win:
  target:
    - target: squirrel
      arch: [x64]
  icon: assets/opencodex-1823ce3c34bea1857fc42f0fafcaa8a93618a071a1c66acaee4e300d63f25b18.ico
  # Code signing is permanently disabled. Keep all three controls explicit so
  # neither electron-builder nor the Squirrel target can discover or invoke a
  # signer when a developer machine happens to have credentials installed.
  forceCodeSigning: false
  signExecutable: false
  signAndEditExecutable: false

# Squirrel.Windows, not NSIS.
#
# ## What changes for the user, stated plainly
#
# Squirrel has no installer UI to speak of: it is always one-click, always
# per-user (into %LOCALAPPDATA%\opencodex), and offers no choice of install
# directory. The NSIS config it replaces deliberately did the opposite —
# `oneClick: false` with `allowToChangeInstallationDirectory` — because the proxy
# writes to ~/.opencodex and rewrites the native Codex config, so the reasoning
# went that the user should see where it is going and be able to opt out.
#
# That consent step is genuinely gone. It is not recreated here, because Squirrel
# cannot: there is no wizard to put it in. The mitigation is that the two things
# the prompt was warning about are both reversible and both visible from the app
# — the Codex rewrite is reverted on a clean shutdown and can be skipped entirely
# with OPENCODEX_DEBUG_SANDBOX, and ~/.opencodex is listed on the Storage screen.
#
# ## What it buys
#
# Per-user install needs no elevation, and Squirrel's delta/full nupkg feed is
# the format Electron's own autoUpdater speaks, so update delivery has a
# supported path rather than re-running a full installer.
#
# ## The part that is not optional
#
# Squirrel drives the app with `--squirrel-install`, `--squirrel-updated`,
# `--squirrel-uninstall` and `--squirrel-obsolete` during install and uninstall.
# An app that does not answer those launches its full UI four times during a
# silent install and blocks its own uninstall. `electron/main.mjs` handles them
# before anything else runs.
squirrelWindows:
  # No .msi: it is a second artifact with a second update path and nothing here
  # needs Group Policy deployment.
  msi: false
  # Keep the package/update-feed identity stable even though productName is the
  # correctly presented OpenCodex label. This is the name Squirrel uses for the
  # package and feed, not a second display-name setting.
  name: opencodex-desktop
  # Add/Remove Programs reads this URL directly. It must be immutable public
  # HTTPS content, not a mutable remote default or a path that only exists in a
  # developer checkout. The docs-site publishes the byte-identical ICO.
  iconUrl: https://opencodex.me/assets/opencodex-1823ce3c34bea1857fc42f0fafcaa8a93618a071a1c66acaee4e300d63f25b18.ico
