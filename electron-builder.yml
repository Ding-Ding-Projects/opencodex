# electron-builder configuration for the opencodex desktop app.
#
# Build:  npx --yes electron-builder@26 --win --publish never
#
# `electron` is deliberately NOT a devDependency of this repo. electron-builder
# downloads the runtime itself when `electronVersion` is pinned here, which keeps
# a ~100 MB download out of every existing CI job that runs `bun install`.
# Bump this line to move the desktop app to a newer Electron.
electronVersion: 43.2.0

appId: com.opencodex.desktop
productName: opencodex
copyright: MIT

# The published npm package keeps its own `name` and `main`; overriding them only
# in the packaged copy means the desktop build needs no changes to package.json.
extraMetadata:
  name: opencodex-desktop
  main: electron/main.mjs

directories:
  output: dist-desktop
  buildResources: assets

# asar is off on purpose — see the comment on ROOT in electron/main.mjs. The proxy
# is Bun reading TypeScript off disk and exec'ing a bundled bun binary; neither
# survives being packed into an archive.
asar: false

files:
  - electron/**
  - bin/**
  - src/**
  - gui/dist/**
  - package.json
  # The COMPLETE production node_modules tree, not an allowlist. The first draft
  # enumerated top-level deps and missed @modelcontextprotocol/sdk's transitive
  # tree (express, hono, ajv, jose, ~40 packages) — the installed app would have
  # crashed the moment MCP code loaded. The CI workflows run
  # `bun install --production` immediately before packaging, so this glob picks
  # up exactly the runtime tree and nothing dev-only. The target machine needs
  # NOTHING preinstalled: no Node, no npm, no Bun — Electron's own Node runs
  # bin/ocx.mjs, and the bundled bun binary runs the proxy.
  - node_modules/**
  # Nothing below is needed at runtime and all of it is large.
  - "!**/*.map"
  - "!**/*.md"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"

# Windows is the only supported desktop target. macOS and Linux targets were
# removed deliberately rather than left half-configured — a target that is
# declared but never built is a promise the project is not keeping.
#
# If a platform is added back later, note that the desktop app must not become
# the place where features diverge: anything that works on another OS has to work
# on Windows too. See docs/design-system/m3-port-handoff.md, "Platform support".
win:
  target:
    - target: nsis
      arch: [x64]
  icon: gui/public/logo.png

nsis:
  # Not one-click: the proxy writes to ~/.opencodex and rewrites the native Codex
  # config, so the user should see where it is going and be able to opt out.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: opencodex
  # Leave ~/.opencodex alone on uninstall: it holds the user's providers, accounts
  # and API keys, and an uninstall is not consent to delete credentials.
  deleteAppDataOnUninstall: false
