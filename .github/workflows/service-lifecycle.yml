name: Service lifecycle

on:
  pull_request:
    branches: [main, dev, dev2-go]
    paths:
      - "src/service.ts"
      # Keep in sync with the release.yml service-gate regex (release.yml "Require
      # successful Windows CI" step). src/cli.ts is the pre-restructure compat
      # stub that durable launchers still execute.
      - "src/cli.ts"
      - "src/cli/index.ts"
      - "src/lib/bun-runtime.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/service-lifecycle.yml"
  push:
    paths:
      - "src/service.ts"
      # Keep in sync with the release.yml service-gate regex (see above).
      - "src/cli.ts"
      - "src/cli/index.ts"
      - "src/lib/bun-runtime.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/service-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-schtasks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Write minimal config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.opencodex" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.opencodex\config.json" -Value '{"port":10199,"providers":{}}'

      - name: Install service
        shell: pwsh
        run: bun run src/cli/index.ts service install

      - name: Verify scheduled task is healthy
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -ne $task -and $task.State -eq "Running" -and $healthy) {
              $ready = $true
              break
            }
            Write-Host "waiting for scheduled task health ($attempt/20)"
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task did not become healthy"
          }

      - name: ocx stop should end the task
        shell: pwsh
        run: |
          bun run src/cli/index.ts stop
          $stopped = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -ne $task -and $task.State -ne "Running" -and -not $healthy) {
              $stopped = $true
              break
            }
            Write-Host "waiting for scheduled task stop ($attempt/10)"
            Start-Sleep -Seconds 1
          }
          if (-not $stopped) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task or health endpoint survived ocx stop"
          }

      - name: Uninstall service
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          bun run src/cli/index.ts service uninstall
          $removed = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $task = Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue
            $healthy = $false
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:10199/healthz -TimeoutSec 2
              $healthy = $response.StatusCode -eq 200
            } catch {}
            if ($null -eq $task -and -not $healthy) {
              $removed = $true
              break
            }
            Write-Host "waiting for scheduled task uninstall cleanup ($attempt/10)"
            Start-Sleep -Seconds 1
          }
          if (-not $removed) {
            Get-ScheduledTask -TaskName opencodex-proxy -ErrorAction SilentlyContinue | Format-List *
            Get-Content "$env:USERPROFILE\.opencodex\service.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "scheduled task or proxy survived uninstall"
          }

      - name: Collect service lifecycle artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "service-artifacts"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [ordered]@{
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            jobStatus = $env:JOB_STATUS
            runnerOs = $env:RUNNER_OS
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root "run-metadata.json")
          $log = Join-Path $env:USERPROFILE ".opencodex\service.log"
          if (Test-Path -LiteralPath $log) {
            Copy-Item -LiteralPath $log -Destination (Join-Path $root "service.log") -Force -ErrorAction SilentlyContinue
          }
          & schtasks.exe /Query /TN opencodex-proxy /XML 2>$null |
            Set-Content -Encoding utf8 (Join-Path $root "scheduled-task.xml")
          if ($LASTEXITCODE -ne 0) {
            Set-Content -Encoding utf8 (Join-Path $root "scheduled-task-query.txt") "The scheduled task was not present after cleanup."
          }
          if (-not (Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue)) {
            Set-Content -Encoding utf8 (Join-Path $root "NO_SAFE_ARTIFACTS.txt") "No safe service output was present; metadata records the original job status."
          }

      - name: Upload service lifecycle artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-lifecycle-${{ github.run_id }}
          path: service-artifacts
          if-no-files-found: warn
          retention-days: 14
