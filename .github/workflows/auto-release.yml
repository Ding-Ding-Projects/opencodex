name: Auto release

# Every commit on main that passes CI becomes an installable
# GitHub release: the Windows installer plus the dashboard bundle, tagged
# build-<run>. Gating on the CI run (workflow_run, not push) is the point —
# a red commit never becomes a release, so "latest release" is always a
# working version.
#
# These are GitHub releases only. npm publishing stays in release.yml behind
# its manual dispatch, version check and audit gates — automating that surface
# is a security-review item per MAINTAINERS.md, and this workflow deliberately
# does not touch it.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # The manual door. When the automatic path is broken — a refused token, a
  # transient API failure, a commit whose CI went red for an unrelated reason —
  # this builds the installer anyway and leaves it as an artifact. Waiting for
  # the pipeline to be fixed before anyone can get a build is how a working
  # installer sits unbuilt for hours.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build"
        required: false
        default: main
      publish:
        description: "Also publish a GitHub release (off = artifact only)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  # Per-SHA, never cancelled: each green commit gets its own release, and a
  # newer push must not abort a publish that is already uploading an
  # installer. Releases are tagged build-<run>, so two in flight cannot
  # collide on a tag.
  group: auto-release-${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    # Green CI on a push, or an explicit manual request. `workflow_run` also
    # fires for PR CI runs, which must never publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact commit CI validated
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      # One resolved SHA for every step below. The manual path has no
      # `workflow_run.head_sha`, and a branch name is not a commit — the release
      # target, the codename and the notes must all name the same thing or the
      # release says it is one commit while carrying another.
      - name: Resolve the commit being released
        shell: bash
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # "build 26" names nothing anybody can remember a week later. The dish is
      # drawn from the dashboard's own table, so a codename can only ever be a
      # dish that already ships a photo — and the script exits non-zero if the
      # art is missing rather than publishing a release with a broken image.
      - name: Pick the dim sum codename
        shell: bash
        run: bun scripts/release-codename.ts "$SHA" "${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Install proxy dependencies
        run: bun install --frozen-lockfile

      - name: Verify the Bun runtime was unpacked
        shell: bash
        run: |
          size=$(wc -c < node_modules/bun/bin/bun.exe 2>/dev/null || echo 0)
          echo "bun.exe is $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Bun binary is the placeholder stub — the installer would not start."
            exit 1
          fi

      - name: Install dashboard dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Build the dashboard
        working-directory: gui
        run: bun run build

      - name: Pack the dashboard bundle
        shell: bash
        run: |
          cd gui/dist && 7z a ../../opencodex-dashboard.zip . > /dev/null
          echo "packed $(du -h ../../opencodex-dashboard.zip | cut -f1)"

      - name: Build the Windows installer
        run: npx --yes electron-builder@26.15.3 --win --publish never

      # Upload BEFORE publishing, and regardless of what happens after.
      #
      # A run once built a 181 MB working installer and threw it away because
      # `gh release create` came back "HTTP 403: Resource not accessible by
      # integration". The build was fine; only the last API call was refused,
      # and there was nothing left to download. Whatever breaks in the publish
      # step from here on, the installer it already built survives it.
      - name: Keep the installer as an artifact, whatever happens next
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencodex-setup-${{ github.run_number }}
          path: |
            dist-desktop/*.exe
            opencodex-dashboard.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0 # An NSIS installer is already compressed.

      - name: Create the release
        # Skipped only when a manual run asked for the artifact alone.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        env:
          # The workflow token is refused for release creation on this
          # repository even with `contents: write` — measured, not assumed:
          # run 30600902455 got a 403 on POST /releases. `ORG_TOKEN` is the
          # organization secret provided for exactly this. The chain keeps an
          # optional repo-scoped PAT ahead of it and the workflow token as a
          # last resort, so a fork with none of them still runs and fails
          # honestly rather than not running at all.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          version=$(node -p "require('./package.json').version")

          # Fail before creating anything if electron-builder produced no installer.
          # `gh release create` publishes the release first and uploads assets after,
          # so an empty `installer` would leave a real, visible release carrying only
          # the dashboard zip — which is precisely the "release with no installer"
          # this pipeline exists to never produce.
          installer=$(ls dist-desktop/*.exe 2>/dev/null | head -1)
          if [ -z "$installer" ] || [ ! -s "$installer" ]; then
            echo "::error::No Windows installer was produced in dist-desktop/ — refusing to publish a release without one."
            ls -la dist-desktop/ 2>/dev/null || echo "dist-desktop/ does not exist"
            exit 1
          fi
          echo "installer: $installer ($(wc -c < "$installer") bytes)"
          echo "codename: $DISH_NAME ($DISH_ZH)"

          # A heredoc rather than a quoted string: the notes are markdown, and
          # an image tag inside a shell string is one stray quote away from
          # becoming an unreadable release note nobody notices until it is
          # published.
          notes=$(cat <<NOTES
          ### 🥟 The **$DISH_ZH $DISH_NAME** build

          <img src="$DISH_PHOTO" alt="$DISH_NAME ($DISH_ZH)" width="360">

          *$DISH_ZH · $DISH_NAME · \`$DISH_JYUTPING\`*

          Automated build of \`${SHA:0:9}\` (v${version}), published because CI passed on it.

          | Asset | What it is |
          | --- | --- |
          | **opencodex-setup.exe** | Windows desktop app — proxy + dashboard, tray, start at login |
          | **opencodex-dashboard.zip** | The built dashboard alone; serve it next to a running proxy |

          Installable releases, not npm packages — the npm package still ships through the audited Release workflow.
          NOTES
          )
          gh release create "$tag" \
            --target "$SHA" \
            --title "build ${{ github.run_number }} · $DISH_ZH $DISH_NAME — v${version} @ ${SHA:0:9}" \
            --notes "$notes" \
            "$installer#opencodex-setup.exe" \
            "opencodex-dashboard.zip"

      # A red run is not self-explanatory when the thing that failed was the
      # last API call. Say plainly that the installer exists and where, so the
      # answer to "can I get a build?" is on the run that failed rather than
      # somewhere the reader has to know to look.
      - name: Point at the artifact when publishing failed
        if: failure()
        shell: bash
        run: |
          echo "::warning::Publishing failed, but the installer was built and is attached to this run as the artifact 'opencodex-setup-${{ github.run_number }}'. Download it from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Prune old automated builds (keep 10)
        # Never let tidying delete a release when the publish above did not run.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
        run: |
          # Only build-* releases are pruned; versioned releases are never touched.
          gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("build-")) | .tagName' \
            | sort -t- -k2 -rn | tail -n +11 \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --cleanup-tag --yes || true
              done
