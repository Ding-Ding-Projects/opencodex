name: Auto release

# Every commit on main that passes CI becomes an installable
# GitHub release: the Windows installer plus the dashboard bundle, tagged
# build-<run>. Gating on the CI run (workflow_run, not push) is the point —
# a red commit never becomes a release, so "latest release" is always a
# working version.
#
# These are GitHub releases only. npm publishing stays in release.yml behind
# its manual dispatch, version check and audit gates — automating that surface
# is a security-review item per MAINTAINERS.md, and this workflow deliberately
# does not touch it.

on:
  # Every push to main builds an installer, full stop. This used to hang off
  # `workflow_run: ["CI"]`, which meant a commit only ever got a build if a
  # second workflow completed, matched by *name*, and reported success — three
  # ways to get nothing, and all three happened in one evening: CI cancelled by
  # a newer push, CI red on a stale assertion, and the name matched but the
  # publish token was refused. Building on the push itself removes the
  # dependency; the CI check moves to where it belongs, in front of the publish
  # step alone.
  push:
    branches: [main]
  # The manual door. When something is broken — a refused token, a transient API
  # failure, a commit whose CI went red for an unrelated reason — this builds the
  # installer anyway and leaves it as an artifact. Waiting for the pipeline to be
  # fixed before anyone can get a build is how a working installer sits unbuilt
  # for hours.
  workflow_dispatch:
    inputs:
      ref:
        # Blank rather than "main" on purpose. The concurrency key below is
        # `inputs.ref || github.sha`, so a dispatch that says "main" keys on the
        # string "main" while the push of that very commit keys on its SHA —
        # two groups, two runs, the same 182 MB installer built twice. Left
        # blank it falls through to the same SHA the push used, and the second
        # run is deduplicated instead of duplicated.
        description: "Commit, branch or tag to build (blank = the current commit)"
        required: false
        default: ""
      publish:
        description: "Also publish a GitHub release (off = artifact only)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  # Per-SHA, never cancelled: each green commit gets its own release, and a
  # newer push must not abort a publish that is already uploading an
  # installer. Releases are tagged build-<run>, so two in flight cannot
  # collide on a tag.
  group: auto-release-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the commit being built
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # One resolved SHA for every step below. A branch name is not a commit,
      # and the release target, the codename and the notes must all name the
      # same thing — otherwise a release claims one commit while carrying
      # another.
      - name: Resolve the commit being released
        shell: bash
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # "build 26" names nothing anybody can remember a week later. The dish is
      # drawn from the dashboard's own table, so a codename can only ever be a
      # dish that already ships a photo — and the script exits non-zero if the
      # art is missing rather than publishing a release with a broken image.
      - name: Pick the dim sum codename
        shell: bash
        run: bun scripts/release-codename.ts "$SHA" "${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Install proxy dependencies
        run: bun install --frozen-lockfile

      - name: Verify the Bun runtime was unpacked
        shell: bash
        run: |
          size=$(wc -c < node_modules/bun/bin/bun.exe 2>/dev/null || echo 0)
          echo "bun.exe is $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Bun binary is the placeholder stub — the installer would not start."
            exit 1
          fi

      - name: Install dashboard dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      # Stamp the build so the running app can say which one it is. Without
      # these the dashboard reports the `package.json` version and nothing else,
      # which reads identically across every installer between two npm releases
      # — for a while that was a dozen builds all calling themselves 2.7.42.
      # The dish codename is deliberately NOT passed: the app derives it from
      # the commit with the same function that titles the release, so the two
      # cannot be set to disagree.
      - name: Build the dashboard
        working-directory: gui
        env:
          OCX_BUILD: ${{ github.run_number }}
          OCX_COMMIT: ${{ env.SHA }}
        run: bun run build

      # The same two facts the dashboard bundle just baked in, on disk this time.
      #
      # The bundle's copy answers "which build am I looking at" for a human. This
      # one answers it for two programs: `/healthz` reports it, and the desktop
      # shell reads it to decide whether a proxy already holding its port is the
      # build it just installed or the one it just replaced. Without it those two
      # are indistinguishable — both say v2.7.42 — so an updated app adopted the
      # old proxy and served the old dashboard. See electron/proxy-adoption.mjs.
      - name: Stamp the build on disk
        shell: bash
        run: |
          printf '{"build":"%s","commit":"%s"}\n' "${{ github.run_number }}" "${{ env.SHA }}" > build-info.json
          cat build-info.json

      - name: Pack the dashboard bundle
        shell: bash
        run: |
          cd gui/dist && 7z a ../../opencodex-dashboard.zip . > /dev/null
          echo "packed $(du -h ../../opencodex-dashboard.zip | cut -f1)"

      - name: Build the Windows installer
        run: npx --yes electron-builder@26.15.3 --win --publish never

      # Upload BEFORE publishing, and regardless of what happens after.
      #
      # A run once built a 181 MB working installer and threw it away because
      # `gh release create` came back "HTTP 403: Resource not accessible by
      # integration". The build was fine; only the last API call was refused,
      # and there was nothing left to download. Whatever breaks in the publish
      # step from here on, the installer it already built survives it.
      - name: Keep the installer as an artifact, whatever happens next
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencodex-setup-${{ github.run_number }}
          path: |
            dist-desktop/**/*.exe
            dist-desktop/**/*.nupkg
            dist-desktop/**/RELEASES
            opencodex-dashboard.zip
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0 # A Squirrel installer and its nupkg are already compressed.

      # Building on every push must not mean publishing on every push. The
      # invariant that a red commit never becomes a release is unchanged; the
      # check simply moved from "what triggered this job" to "may this job
      # publish", which is where it was always doing its real work.
      #
      # Bounded on purpose. A CI run that hangs must not hold this job to its
      # 45-minute ceiling, and a commit whose CI has already concluded without
      # success is a definite no that there is no point waiting out.
      - name: Require successful CI for this commit
        id: ci
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            url=$(gh run list --workflow ci.yml --commit "$SHA" --status success --limit 5 \
                    --json url --jq '.[0].url // ""' 2>/dev/null || echo "")
            if [ -n "$url" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "CI passed for ${SHA}: ${url}"
              exit 0
            fi

            total=$(gh run list --workflow ci.yml --commit "$SHA" --limit 5 \
                      --json status --jq 'length' 2>/dev/null || echo 0)
            running=$(gh run list --workflow ci.yml --commit "$SHA" --limit 5 \
                        --json status --jq '[.[]|select(.status != "completed")]|length' 2>/dev/null || echo 0)

            # `total == 0` means CI has not registered a run yet, not that it
            # failed — the push that started this job may still be propagating.
            # Only a run that exists and has finished unsuccessfully is a no.
            if [ "$total" != "0" ] && [ "$running" = "0" ]; then
              echo "::warning::CI concluded without success for ${SHA} — building the artifact, but not publishing a release."
              exit 1
            fi
            sleep 30
          done
          echo "::warning::Timed out waiting for CI on ${SHA} — the installer is attached to this run as an artifact."
          exit 1

      - name: Create the release
        id: publish
        # Green CI, and not a manual run that asked for the artifact alone.
        if: ${{ steps.ci.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        shell: bash
        env:
          # The workflow token is refused for release creation on this
          # repository even with `contents: write` — measured, not assumed:
          # run 30600902455 got a 403 on POST /releases. `ORG_TOKEN` is the
          # organization secret provided for exactly this. The chain keeps an
          # optional repo-scoped PAT ahead of it and the workflow token as a
          # last resort, so a fork with none of them still runs and fails
          # honestly rather than not running at all.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          version=$(node -p "require('./package.json').version")

          # Fail before creating anything if electron-builder produced no installer.
          # `gh release create` publishes the release first and uploads assets after,
          # so an empty `installer` would leave a real, visible release carrying only
          # the dashboard zip — which is precisely the "release with no installer"
          # this pipeline exists to never produce.
          # Recursive, and NOT `dist-desktop/*.exe`. Squirrel writes into
          # `dist-desktop/squirrel-windows/`, where NSIS wrote to the root — so
          # the flat glob found nothing and this step correctly refused to
          # publish a release with no installer. The build had succeeded.
          #
          # `-name '*.exe'` also matches Squirrel's own `Update.exe` if it is
          # copied out, so the Setup binary is selected by name rather than by
          # being the first thing `ls` happens to return.
          installer=$(find dist-desktop -type f -name '*Setup*.exe' 2>/dev/null | head -1)
          [ -n "$installer" ] || installer=$(find dist-desktop -type f -name '*.exe' ! -name 'Update.exe' 2>/dev/null | head -1)
          if [ -z "$installer" ] || [ ! -s "$installer" ]; then
            echo "::error::No Windows installer was produced in dist-desktop/ — refusing to publish a release without one."
            ls -la dist-desktop/ 2>/dev/null || echo "dist-desktop/ does not exist"
            exit 1
          fi
          echo "installer: $installer ($(wc -c < "$installer") bytes)"

          # Squirrel's update feed travels with the installer or not at all.
          # `RELEASES` plus the full `.nupkg` are what Squirrel reads to decide
          # whether a newer version exists; a release carrying only Setup.exe is
          # installable but not updatable, which is most of the reason for
          # choosing Squirrel over NSIS in the first place. Collected into an
          # array so a missing one is visible here rather than as a silent
          # omission from the asset list.
          feed=()
          while IFS= read -r f; do
            [ -s "$f" ] && feed+=("$f")
          done < <(find dist-desktop -type f \( -name RELEASES -o -name '*.nupkg' \) 2>/dev/null)
          if [ ${#feed[@]} -lt 2 ]; then
            echo "::warning::Squirrel update feed incomplete (found ${#feed[@]} of RELEASES + .nupkg). The release will install but not self-update."
          fi
          echo "feed: ${feed[*]:-none}"
          echo "codename: $DISH_NAME ($DISH_ZH)"

          # The dish photo travels WITH the release, not only as a link in the
          # notes. The note's <img> points at raw.githubusercontent at this SHA,
          # which renders today and stops rendering the moment the repository is
          # made private, renamed, or transferred — leaving a permanent record
          # with a broken image. An attached asset is part of the release itself
          # and survives all three.
          #
          # `release-codename.ts` has already refused to name a dish whose art is
          # missing, so this file exists whenever we reach here; the check is for
          # the case where that guarantee is changed out from under us, and it
          # warns rather than failing, because a release with an installer and no
          # photo is a far better outcome than no release at all.
          photo="gui/public/dimsum/${DISH_ID}.webp"
          photo_asset=""
          if [ -s "$photo" ]; then
            photo_asset="$photo#${DISH_ID}.webp"
            echo "dish photo: $photo ($(wc -c < "$photo") bytes)"
          else
            echo "::warning::Dish photo $photo is missing; publishing without it."
          fi

          # The line count, produced by this run over this commit.
          #
          # The release is the record for this figure precisely because it is
          # pinned to a tag: a number in prose is stale the day after it is
          # written, and a number typed by hand was never measured at all. The
          # committed script is the single definition, so the table here and the
          # one a contributor gets locally cannot disagree.
          lines=$(bun run scripts/count-lines.ts)

          # A heredoc rather than a quoted string: the notes are markdown, and
          # an image tag inside a shell string is one stray quote away from
          # becoming an unreadable release note nobody notices until it is
          # published.
          notes=$(cat <<NOTES
          ### 🥟 The **$DISH_ZH $DISH_NAME** build

          <img src="$DISH_PHOTO" alt="$DISH_NAME ($DISH_ZH)" width="360">

          *$DISH_ZH · $DISH_NAME · \`$DISH_JYUTPING\`*

          Automated build of \`${SHA:0:9}\` (v${version}), published because CI passed on it.

          | Asset | What it is |
          | --- | --- |
          | **opencodex-setup.exe** | Windows desktop app — proxy + dashboard, tray, start at login |
          | **opencodex-dashboard.zip** | The built dashboard alone; serve it next to a running proxy |
          | **${DISH_ID}.webp** | The build's dim sum, attached so it outlives the link above |

          Installable releases, not npm packages — the npm package still ships through the audited Release workflow.

          <details>
          <summary>📏 <strong>Lines of code at this commit</strong></summary>

          $lines

          Produced by this run with \`bun run scripts/count-lines.ts\` over \`${SHA:0:9}\`.

          </details>
          NOTES
          )
          gh release create "$tag" \
            --target "$SHA" \
            --title "build ${{ github.run_number }} · $DISH_ZH $DISH_NAME — v${version} @ ${SHA:0:9}" \
            --notes "$notes" \
            "$installer#opencodex-setup.exe" \
            "opencodex-dashboard.zip" \
            ${photo_asset:+"$photo_asset"}

      # Neither a red run nor a skipped publish is self-explanatory when the
      # build itself succeeded. Say plainly that the installer exists and where,
      # so the answer to "can I get a build?" is on the run itself rather than
      # somewhere the reader has to know to look.
      - name: Point at the artifact when no release was published
        if: ${{ always() && steps.publish.outcome != 'success' }}
        shell: bash
        run: |
          echo "::warning::No release was published, but the installer was built and is attached to this run as the artifact 'opencodex-setup-${{ github.run_number }}'. Download it from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Prune old automated builds (keep 10)
        # Only after a release actually published. Tidying old builds while the
        # new one did not publish is how "keep the last 10" becomes "keep 9".
        if: ${{ steps.publish.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
        run: |
          # Only build-* releases are pruned; versioned releases are never touched.
          gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("build-")) | .tagName' \
            | sort -t- -k2 -rn | tail -n +11 \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --cleanup-tag --yes || true
              done
