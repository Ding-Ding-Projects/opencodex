# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Gating and least-privilege: errors fail the job (`blocking: error`); warnings
# remain in the uploaded report for review without making unrelated PRs red.
# Write-scoped outputs (sticky PR comments, inline review comments, commit
# statuses) stay disabled so the workflow needs no write permissions. Do not
# re-add write scopes without revisiting tests/ci-workflows.test.ts, which
# pins this contract.
#
# Docs: https://www.react.doctor/docs/ci-and-prs/github-actions-setup
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the PR's changed files relative to the merge base of the target branch.
  pull_request:
    # A non-GUI change has no React surface to inspect. The action's changed-file
    # fallback treats an empty GUI set as a full scan, so scope the PR trigger to
    # GUI paths; the main push trigger below remains the full-tree health scan.
    paths: ["gui/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend.
  push:
    branches: ["main"]

permissions:
  contents: read
  # Needed so the action can list PR files for --changed-files-from.
  # Without this, listFiles fails, the changed-files file is never written,
  # and the CLI exits 1 on ENOENT even for fork PRs.
  pull-requests: read

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a
# new commit arrives, so only the latest run remains.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find
      # the merge base with the target branch; a shallow checkout would make PR
      # runs report every pre-existing issue instead of only new ones.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@938008119a288f2fb47c66a69cd9279a21f31784 # v2.2.7
        with:
          directory: gui
          # Pin the npm engine — the action wrapper would otherwise fetch
          # react-doctor@latest, silently skewing CI from the local pinned runs.
          version: "0.9.2"
          # Fail the job on errors; warnings remain visible in the report.
          blocking: error
          comment: false
          review-comments: false
          commit-status: false

      - name: Collect React Doctor report
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "react-doctor-artifacts"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $report = Join-Path $root "react-doctor-report.json"
          npm exec --yes --package react-doctor@0.9.2 -- react-doctor gui --scope changed --base $env:BASE_REF --no-telemetry --json --json-out $report --blocking error
          [ordered]@{
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            jobStatus = $env:JOB_STATUS
            runnerOs = $env:RUNNER_OS
            baseRef = $env:BASE_REF
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root "run-metadata.json")
          if (-not (Test-Path -LiteralPath $report)) {
            Set-Content -Encoding utf8 (Join-Path $root "NO_SAFE_ARTIFACTS.txt") "React Doctor did not emit a report; metadata records the original job status."
          }

      - name: Upload React Doctor artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-doctor-${{ github.run_id }}
          path: react-doctor-artifacts
          if-no-files-found: warn
          retention-days: 14
