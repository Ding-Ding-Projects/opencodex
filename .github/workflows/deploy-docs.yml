name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build with Astro
        shell: pwsh
        working-directory: docs-site
        # Keep the build explicit on Windows. The hosted Astro action wraps the
        # same command in a Bash shim and has intermittently mis-rendered the
        # root locale search JSON (`Missing parameter: locale`) even when a
        # clean local build is green. Direct Bun invocation keeps the checked-in
        # lockfile, environment, and output path visible and deterministic.
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          DOCS_BASE: ${{ vars.DOCS_BASE }}
        run: |
          $ErrorActionPreference = "Stop"
          bun install --frozen-lockfile
          bun run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

      - name: Collect docs build artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "docs-artifacts"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [ordered]@{
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            jobStatus = $env:JOB_STATUS
            runnerOs = $env:RUNNER_OS
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root "run-metadata.json")
          $dist = Join-Path $env:GITHUB_WORKSPACE "docs-site\dist"
          if (Test-Path -LiteralPath $dist) {
            Copy-Item -LiteralPath $dist -Destination (Join-Path $root "dist") -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not (Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue)) {
            Set-Content -Encoding utf8 (Join-Path $root "NO_SAFE_ARTIFACTS.txt") "No safe docs output was present; metadata records the original job status."
          }

      - name: Upload docs build artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-build-${{ github.run_id }}
          path: docs-artifacts
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
