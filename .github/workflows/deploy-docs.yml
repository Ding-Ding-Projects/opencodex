name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build with Astro
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          path: ./docs-site
          node-version: 22
          package-manager: bun@latest

      - name: Collect docs build artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "docs-artifacts"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [ordered]@{
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            jobStatus = $env:JOB_STATUS
            runnerOs = $env:RUNNER_OS
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root "run-metadata.json")
          $dist = Join-Path $env:GITHUB_WORKSPACE "docs-site\dist"
          if (Test-Path -LiteralPath $dist) {
            Copy-Item -LiteralPath $dist -Destination (Join-Path $root "dist") -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not (Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue)) {
            Set-Content -Encoding utf8 (Join-Path $root "NO_SAFE_ARTIFACTS.txt") "No safe docs output was present; metadata records the original job status."
          }

      - name: Upload docs build artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-build-${{ github.run_id }}
          path: docs-artifacts
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
