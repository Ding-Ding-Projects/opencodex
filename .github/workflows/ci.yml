name: Windows CI

on:
  pull_request:
    branches: [main, dev, dev2-go]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
  push:
    branches: [main, preview, dev]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest
    # The Windows full suite stays bounded below Bun's internal-assertion range;
    # leave enough room for the slower but deterministic worker cap and GUI smokes.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        # Bun 1.3.14 can hit an internal assertion on Windows at its default
        # worker count; keep the full suite intact while bounding concurrency.
        run: bun test --isolate tests --max-concurrency=8 --timeout=30000

      - name: GUI tests
        run: cd gui && bun test tests

      - name: Privacy scan
        run: bun run privacy:scan

      - name: Check release helper syntax
        run: bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check

      - name: GUI lint
        run: |
          cd gui
          bun run lint

      - name: GUI build
        run: |
          cd gui
          bun run build

      - name: CLI help smoke
        run: bun run src/cli/index.ts help

      # Preserve build outputs and failure context even when an earlier gate fails.
      # The collector is deliberately defensive and never changes the original
      # test verdict; only explicitly safe paths are copied.
      - name: Collect Windows CI artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "ci-artifacts\full"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [ordered]@{
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            jobStatus = $env:JOB_STATUS
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root "run-metadata.json")

          $workspace = $env:GITHUB_WORKSPACE
          $safeDirectories = @(
            @{ Source = (Join-Path $workspace "gui\dist"); Destination = (Join-Path $root "gui-dist") },
            @{ Source = (Join-Path $workspace ".tmp\ci-release-script-check"); Destination = (Join-Path $root "release-script-check") }
          )
          foreach ($item in $safeDirectories) {
            if (Test-Path -LiteralPath $item.Source) {
              Copy-Item -LiteralPath $item.Source -Destination $item.Destination -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          foreach ($pattern in @("pack.json", "*.tgz", "npm-debug.log*")) {
            Get-ChildItem -Path $workspace -Filter $pattern -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $root -Force -ErrorAction SilentlyContinue
          }
          if (-not (Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue)) {
            Set-Content -Encoding utf8 (Join-Path $root "NO_SAFE_ARTIFACTS.txt") "No safe build output was present; metadata records the original job status."
          }

      - name: Upload Windows CI artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ci-full-${{ github.run_id }}
          path: ci-artifacts/full
          if-no-files-found: warn
          retention-days: 14

  npm-global-smoke:
    name: npm-global windows-latest
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Deliberately NO setup-bun: prove `npm install -g` works without a
      # separately-installed Bun. The launcher uses the bundled `bun` dependency.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install package dependencies
        run: npm install

      - name: Build package assets
        run: npm run build:gui

      - name: Pack
        shell: bash
        run: npm pack --json > pack.json

      - name: Verify packed GUI asset
        run: node -e "const p=require('./pack.json')[0]; if (!p.files.some(f => f.path === 'gui/dist/index.html')) { console.error('missing gui/dist/index.html in npm pack'); process.exit(1); }"

      - name: Install globally (downloads bundled bun)
        shell: bash
        run: npm install -g ./bitkyc08-opencodex-*.tgz

      - name: ocx help via bundled bun
        run: ocx help

      - name: Collect npm global smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          $root = Join-Path $env:GITHUB_WORKSPACE "ci-artifacts\npm-global"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [ordered]@{
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sha = $env:GITHUB_SHA
            jobStatus = $env:JOB_STATUS
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root "run-metadata.json")
          foreach ($pattern in @("pack.json", "*.tgz", "npm-debug.log*")) {
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter $pattern -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $root -Force -ErrorAction SilentlyContinue
          }
          $guiDist = Join-Path $env:GITHUB_WORKSPACE "gui\dist"
          if (Test-Path -LiteralPath $guiDist) {
            Copy-Item -LiteralPath $guiDist -Destination (Join-Path $root "gui-dist") -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not (Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue)) {
            Set-Content -Encoding utf8 (Join-Path $root "NO_SAFE_ARTIFACTS.txt") "No safe package output was present; metadata records the original job status."
          }

      - name: Upload npm global smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ci-npm-global-${{ github.run_id }}
          path: ci-artifacts/npm-global
          if-no-files-found: warn
          retention-days: 14
