# Windows only, deliberately. `electron-builder.yml` ships an NSIS installer and
# nothing else — the macOS and Linux desktop targets were removed rather than
# left half-configured — so validating on runners the product never ships to
# bought nothing and cost three times the wall-clock on every commit. A green
# tick from a platform with no installer is not evidence about anything a user
# can install.
name: CI

on:
  pull_request:
    branches: [main, dev, dev2-go]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
  push:
    branches: [main, preview, dev]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-SHA, and never cancelled. Grouping by ref meant a second push killed
  # the run already testing the first, so a commit could reach main having
  # been tested by nothing — and `Auto release` gates on this workflow's
  # conclusion, so a cancelled run also silently skips the release.
  group: cross-platform-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is the binding constraint and has crept past 12 minutes.
    # Measured on run 30503517934 (5981 tests): install 33s, typecheck 11s,
    # `bun test` 10m04s, GUI tests 30s, privacy 4s, GUI lint 23s — the suite
    # alone is ~10 of the 12 minutes, so the job was cancelled two seconds into
    # the GUI build with every substantive step already green.
    #
    # 20 leaves real headroom without hiding a hang: a genuinely stuck run blows
    # 20 as readily as 12. If this needs raising again, shard the suite instead —
    # the ceiling is not the problem worth solving a third time.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One entry rather than a bare `runs-on:` so the narrowing is visible as
        # a narrowing, and widening again is one line if a second desktop target
        # is ever shipped.
        os: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test --isolate tests

      - name: GUI tests
        run: cd gui && bun test tests

      - name: Privacy scan
        run: bun run privacy:scan

      - name: Check release helper syntax
        run: bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check

      - name: GUI lint
        run: |
          cd gui
          bun run lint

      - name: GUI build
        run: |
          cd gui
          bun run build

      - name: CLI help smoke
        run: bun run src/cli/index.ts help

  npm-global-smoke:
    name: npm-global ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Deliberately NO setup-bun: prove `npm install -g` works without a
      # separately-installed Bun. The launcher uses the bundled `bun` dependency.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install package dependencies
        run: npm install

      - name: Build package assets
        run: npm run build:gui

      - name: Pack
        shell: bash
        run: npm pack --json > pack.json

      - name: Verify packed GUI asset
        run: node -e "const p=require('./pack.json')[0]; if (!p.files.some(f => f.path === 'gui/dist/index.html')) { console.error('missing gui/dist/index.html in npm pack'); process.exit(1); }"

      - name: Install globally (downloads bundled bun)
        shell: bash
        run: npm install -g ./bitkyc08-opencodex-*.tgz

      - name: ocx help via bundled bun
        run: ocx help
