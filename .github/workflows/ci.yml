# Windows only, deliberately. `electron-builder.yml` ships an NSIS installer and
# nothing else — the macOS and Linux desktop targets were removed rather than
# left half-configured — so validating on runners the product never ships to
# bought nothing and cost three times the wall-clock on every commit. A green
# tick from a platform with no installer is not evidence about anything a user
# can install.
name: CI

on:
  pull_request:
    branches: [main, dev, dev2-go]
    paths:
      - "src/**"
      - "bin/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - ".gitattributes"
      - ".npmignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/enforce-pr-target.yml"
      - ".github/workflows/stale-needs-info.yml"
  # No `paths` filter on push, deliberately, unlike the pull_request trigger
  # above. `Auto release` now gates publishing on "a successful CI run exists
  # for this exact commit", and a path filter makes that question unanswerable
  # for any commit that touches only excluded files: CI never runs, no verdict
  # is ever recorded, and the release waits out its timeout for a run that was
  # never going to start. That is not hypothetical — it is how 84d8f16b built a
  # 182 MB installer and then published nothing.
  #
  # A commit that changes no code is not untested, but "not untested" and
  # "has a recorded pass" are different things, and only the second one is
  # checkable. Every commit on a release branch gets a verdict. Pull requests
  # keep the filter, where skipping an irrelevant run costs nobody a release.
  push:
    branches: [main, preview, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-SHA, and never cancelled. Grouping by ref meant a second push killed
  # the run already testing the first, so a commit could reach main having
  # been tested by nothing — and `Auto release` gates on this workflow's
  # conclusion, so a cancelled run also silently skips the release.
  group: cross-platform-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is the binding constraint and has crept past 12 minutes.
    # Measured on run 30503517934 (5981 tests): install 33s, typecheck 11s,
    # `bun test` 10m04s, GUI tests 30s, privacy 4s, GUI lint 23s — the suite
    # alone is ~10 of the 12 minutes, so the job was cancelled two seconds into
    # the GUI build with every substantive step already green.
    #
    # 20 left real headroom without hiding a hang: a genuinely stuck run blows
    # 20 as readily as 12. If this needs raising again, shard the suite instead —
    # the ceiling is not the problem worth solving a third time.
    #
    # Raised to 25 for the crash-retry in the Test step below, and only for that.
    # A Bun crash dies about 42s in, so two of them cost ~1.5 minutes before the
    # attempt that actually runs the suite — which on the slowest observed run
    # left the job finishing a shade under 20 and occasionally over it. This is
    # not the suite getting longer; the note above still stands if it does.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # One entry rather than a bare `runs-on:` so the narrowing is visible as
        # a narrowing, and widening again is one line if a second desktop target
        # is ever shipped.
        os: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # Retries ONLY a Bun crash, never a test failure.
      #
      # `windows-latest` is currently serving a mix of runner images, and Bun
      # 1.3.14 panics on one of them: `panic(...): Internal assertion failure /
      # oh no: Bun has crashed. This indicates a bug in Bun, not your code.`,
      # roughly 42s in, after the suite has spawned its ninth worker
      # (`workers_spawned(9) workers_terminated(8)`). Which image a job lands on
      # decides whether CI is green, so the same commit passes and fails:
      #
      #   image 20260728.188.1 -> passed
      #   image 20260714.173.1 -> crashed, three times including a rerun
      #
      # The same suite runs to completion locally on Windows with the same Bun
      # and the same flag (6,304 pass over 457 files), so this is the runner
      # image, not the tests. 1.3.14 is the newest Bun published, so there is
      # nothing to upgrade to, and GitHub does not let a workflow pin an image
      # to a patch version — hence a retry rather than a fix.
      #
      # The guard is the point: it re-runs when Bun died and the run therefore
      # says nothing about the code, and it re-raises immediately on an ordinary
      # non-zero exit. A blind `retry 3` here would turn a genuinely failing test
      # into a green tick on its third roll of the dice, which is worse than the
      # crash it was meant to paper over.
      - name: Test
        shell: pwsh
        run: |
          $attempt = 0
          $max = 3
          while ($true) {
            $attempt++
            Write-Host "::group::bun test --isolate tests (attempt $attempt of $max)"
            $log = "test-attempt-$attempt.log"
            # Tee so the output is still visible in the log as it happens; the
            # copy on disk is what gets pattern-matched afterwards.
            bun test --isolate tests 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { exit 0 }

            $crashed = Select-String -Path $log -SimpleMatch -Quiet `
              -Pattern 'oh no: Bun has crashed'
            if (-not $crashed) {
              Write-Host "::error::Tests failed (exit $code). Not a Bun crash - not retrying."
              exit $code
            }
            if ($attempt -ge $max) {
              Write-Host "::error::Bun crashed on all $max attempts. See the runner image note in ci.yml."
              exit $code
            }
            Write-Host "::warning::Bun crashed rather than failing a test; retrying ($attempt/$max)."
          }

      - name: GUI tests
        run: cd gui && bun test tests

      - name: Privacy scan
        run: bun run privacy:scan

      - name: Check release helper syntax
        run: bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check

      - name: GUI lint
        run: |
          cd gui
          bun run lint

      - name: GUI build
        run: |
          cd gui
          bun run build

      - name: CLI help smoke
        run: bun run src/cli/index.ts help

  npm-global-smoke:
    name: npm-global ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Deliberately NO setup-bun: prove `npm install -g` works without a
      # separately-installed Bun. The launcher uses the bundled `bun` dependency.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install package dependencies
        run: npm install

      - name: Build package assets
        run: npm run build:gui

      - name: Pack
        shell: bash
        run: npm pack --json > pack.json

      - name: Verify packed GUI asset
        run: node -e "const p=require('./pack.json')[0]; if (!p.files.some(f => f.path === 'gui/dist/index.html')) { console.error('missing gui/dist/index.html in npm pack'); process.exit(1); }"

      - name: Install globally (downloads bundled bun)
        shell: bash
        run: npm install -g ./bitkyc08-opencodex-*.tgz

      - name: ocx help via bundled bun
        run: ocx help
