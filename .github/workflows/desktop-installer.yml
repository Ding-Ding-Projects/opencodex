name: Desktop installer

# Builds the opencodex desktop app into a Windows installer you can download and run.
#
# Windows is the only supported desktop target. The job must run on a Windows
# runner regardless: the proxy exec's the Bun binary that `bun install` unpacks
# into node_modules, and that binary is platform-specific.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Per-SHA, so a later push does not cancel an installer build that is
  # already producing the artifact for an earlier commit.
  group: desktop-installer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install proxy dependencies
        # `bun` is a trustedDependency, so its postinstall downloads the real ~98 MB
        # runtime binary here. Without that the packaged app has only the placeholder
        # stub and refuses to start.
        run: bun install --frozen-lockfile

      - name: Verify the Bun runtime was unpacked
        shell: bash
        run: |
          # bin/ocx.mjs treats anything under 1 MB as the placeholder stub, so check
          # the same thing here rather than shipping an installer that cannot start.
          found=""
          for candidate in node_modules/bun/bin/bun.exe node_modules/bun/bin/bun; do
            if [ -f "$candidate" ]; then
              size=$(wc -c < "$candidate")
              echo "$candidate is $size bytes"
              [ "$size" -ge 1000000 ] && found="$candidate"
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::No real Bun binary in node_modules/bun/bin — the postinstall did not run."
            exit 1
          fi

      - name: Install dashboard dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Build the dashboard
        working-directory: gui
        run: bun run build

      - name: Build the installer
        # electron-builder downloads Electron itself from the pinned electronVersion
        # in electron-builder.yml, so neither it nor electron is a repo dependency.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
        run: npx --yes electron-builder@26.15.3 --win --publish never

      - name: Verify unsigned Squirrel feed
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath dist-desktop -Recurse -File -Filter "*.exe" | Where-Object { $_.Name -match "Setup" })
          $releaseIndexes = @(Get-ChildItem -LiteralPath dist-desktop -Recurse -File | Where-Object { $_.Name -eq "RELEASES" })
          $fullPackages = @(Get-ChildItem -LiteralPath dist-desktop -Recurse -File -Filter "*.nupkg" | Where-Object { $_.Name -notmatch "-delta\.nupkg$" })
          if ($setups.Count -eq 0 -or $releaseIndexes.Count -eq 0 -or $fullPackages.Count -eq 0) {
            throw "Squirrel packaging did not produce Setup.exe, RELEASES, and a full .nupkg."
          }
          foreach ($setup in $setups) {
            $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Expected unsigned installer, but $($setup.Name) reported $($signature.Status)."
            }
          }

      - name: List what was produced
        shell: bash
        run: ls -lhR dist-desktop

      - name: Collect installer evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "desktop-artifacts"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          @(
            "run_id=$env:GITHUB_RUN_ID"
            "sha=$env:GITHUB_SHA"
            "job_status=$env:JOB_STATUS"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
          ) | Set-Content -LiteralPath (Join-Path $root "run-metadata.txt") -Encoding utf8

          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "dist-desktop"
          $safeCount = 0
          if (Test-Path -LiteralPath $sourceRoot -PathType Container) {
            Get-ChildItem -LiteralPath $sourceRoot -Recurse -File | Where-Object {
              $_.Extension -in @(".exe", ".nupkg") -or $_.Name -eq "RELEASES"
            } | ForEach-Object {
              $relative = $_.FullName.Substring($sourceRoot.Length).TrimStart([char]"\", [char]"/")
              $destination = Join-Path $root $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
              $safeCount++
            }
          }
          if ($safeCount -eq 0) {
            "No safe installer files were produced." | Set-Content -LiteralPath (Join-Path $root "NO_SAFE_ARTIFACTS.txt") -Encoding utf8
          }

      - name: Upload installer
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencodex-desktop-windows-${{ github.sha }}
          path: desktop-artifacts
          if-no-files-found: warn
          retention-days: 14
