name: Release

# Publish opencodex to npm — jawcode-style: triggered from the Actions tab with an explicit
# version, dist-tag, and a dry-run-first default. Bump package.json on main BEFORE dispatching
# (or use `bun run release <version>`, which does the bump+commit+push+dispatch for you); the
# workflow verifies the version matches before publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must equal package.json (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        options:
          - latest
          - preview
        default: latest
      dry-run:
        description: "Dry run (build + pack, no actual publish)"
        required: false
        type: boolean
        default: true
      expected-sha:
        description: "Immutable release commit this dispatch must publish (fail if the branch moved)"
        required: true
        type: string

permissions:
  contents: write # create the matching GitHub Release + version tag after npm publish
  actions: read # read this run's authoritative start timestamp for release notes
  id-token: write # OIDC auth for Trusted Publishing + automatic provenance attestation

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected-sha }}

      - name: Verify dispatched SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected-sha must be a lowercase full 40-character commit SHA"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::branch moved after the release audit (expected ${EXPECTED_SHA}, got ${GITHUB_SHA}) — refusing to publish an unaudited commit"
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::checkout resolved ${checked_out_sha}, expected immutable candidate ${EXPECTED_SHA}"
            exit 1
          fi

      # opencodex is bun-native; the release job builds the package without running test,
      # lint, typecheck, or static-analysis scripts in GitHub Actions.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # node + npm perform the actual publish. registry-url points npm at the public registry.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Resolve an unused dish only through the shared public-catalog authority.
      # Catalog or network failure emits DISH_AVAILABLE=false and never blocks a release.
      - name: Pick the dim sum codename
        run: bun scripts/release-codename.ts "$GITHUB_SHA" "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 24 runners already
      # provide a compatible npm; avoid replacing the bundled npm because global
      # npm self-updates can lose publish-time dependencies such as sigstore.
      - name: Verify npm version
        run: |
          npm_version="$(npm --version)"
          echo "npm=${npm_version}"
          # shellcheck disable=SC2016 # the node script deliberately avoids shell expansion
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches package.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "package.json=$PKG  input=${RELEASE_VERSION}"
          test "$PKG" = "$RELEASE_VERSION" || {
            echo "::error::package.json ($PKG) != requested (${RELEASE_VERSION}) — bump package.json on main first";
            exit 1;
          }

      - name: Validate release channel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main)
              expected_tag="latest"
              if [[ "$RELEASE_VERSION" == *-* ]]; then
                echo "::error::main releases must use a stable semver version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            refs/heads/preview)
              expected_tag="preview"
              if [[ "$RELEASE_VERSION" != *-preview.* ]]; then
                echo "::error::preview releases must use a preview prerelease version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            *)
              echo "::error::Release must run from main or preview; got ${GITHUB_REF}"
              exit 1
              ;;
          esac
          if [ "$NPM_DIST_TAG" != "$expected_tag" ]; then
            echo "::error::${GITHUB_REF#refs/heads/} releases must publish with npm dist-tag '${expected_tag}', got '${NPM_DIST_TAG}'"
            exit 1
          fi

      # Tokenless publish via Trusted Publishing (OIDC) — NO NPM_TOKEN secret. npm auto-detects the
      # OIDC environment (`id-token: write` above) and generates provenance automatically, so neither a
      # token nor `--provenance` is needed. The payload is built explicitly below and npm lifecycle
      # scripts are disabled for pack/publish so this workflow remains build-and-publication only.
      # PREREQUISITE: configure the Trusted Publisher for this repo + workflow on npmjs.com — possible
      # only AFTER the package's first version exists (do the first publish locally, see the runbook).
      - name: Preflight release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          pkg_name="$(node -p "require('./package.json').name")"
          release_tag="v${RELEASE_VERSION}"
          dry_run="$DRY_RUN"

          git fetch --force --tags origin

          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::${release_tag} already points at ${existing_tag_sha}, not ${GITHUB_SHA}"
            exit 1
          fi

          if [ -n "$existing_tag_sha" ]; then
            if [ "$dry_run" = "true" ]; then
              echo "::notice::${release_tag} already exists at this commit; dry-run only"
            else
              echo "::error::${release_tag} already exists. Refusing to publish a version with pre-existing Git metadata."
              exit 1
            fi
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            if [ "$dry_run" = "true" ]; then
              echo "::notice::GitHub Release ${release_tag} already exists; dry-run only"
            else
              echo "::error::GitHub Release ${release_tag} already exists. Choose the next unused patch version."
              exit 1
            fi
          fi

          if npm view "${pkg_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            if [ "$dry_run" = "true" ]; then
              echo "::notice::${pkg_name}@${RELEASE_VERSION} already exists on npm; dry-run only"
            else
              echo "::error::${pkg_name}@${RELEASE_VERSION} already exists on npm. Choose the next unused patch version."
              exit 1
            fi
          fi

      # The versioned GitHub release is also the stable Windows delivery path.
      # Prepare the exact npm payload and validate its installer before npm can
      # publish anything. A packaging failure must not leave the registry ahead
      # of the required Windows release.
      - name: Prepare npm release payload
        run: bun run build:gui

      - name: Build unsigned Squirrel.Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          CSC_NAME: ""
          CSC_KEYCHAIN: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          WIN_CSC_NAME: ""
        run: |
          $ErrorActionPreference = "Stop"

          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "dist-desktop"
          if (Test-Path -LiteralPath $outputRoot) {
            Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }

          # Environment variables inherited by the runner must not silently
          # reactivate signing. Re-add only the explicit auto-discovery off switch.
          @(
            "CSC_LINK"
            "CSC_KEY_PASSWORD"
            "CSC_NAME"
            "CSC_KEYCHAIN"
            "WIN_CSC_LINK"
            "WIN_CSC_KEY_PASSWORD"
            "WIN_CSC_NAME"
            "CSC_IDENTITY_AUTO_DISCOVERY"
          ) | ForEach-Object {
            Remove-Item -LiteralPath "Env:$_" -ErrorAction SilentlyContinue
          }
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"

          npx --yes electron-builder@26.15.3 --win squirrel --publish never
          if ($LASTEXITCODE -ne 0) {
            throw "electron-builder failed with exit code $LASTEXITCODE"
          }

      - name: Validate unsigned Squirrel.Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "dist-desktop"
          if (-not (Test-Path -LiteralPath $outputRoot -PathType Container)) {
            throw "dist-desktop was not created; refusing to publish a release without Windows assets"
          }

          $setups = @(Get-ChildItem -LiteralPath $outputRoot -Recurse -File -Filter "*Setup*.exe")
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Setup.exe under dist-desktop, found $($setups.Count)"
          }
          foreach ($setup in $setups) {
            $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Setup executable must be unsigned, but $($setup.Name) reported $($signature.Status)"
            }
            Write-Host "Verified NotSigned: $($setup.FullName)"
          }

          $releaseIndexes = @(Get-ChildItem -LiteralPath $outputRoot -Recurse -File -Filter "RELEASES")
          if ($releaseIndexes.Count -ne 1 -or $releaseIndexes[0].Length -eq 0) {
            throw "Expected one non-empty Squirrel RELEASES index, found $($releaseIndexes.Count)"
          }

          $fullPackages = @(Get-ChildItem -LiteralPath $outputRoot -Recurse -File -Filter "*-full.nupkg")
          if ($fullPackages.Count -lt 1 -or @($fullPackages | Where-Object Length -eq 0).Count -gt 0) {
            throw "Expected at least one non-empty full Squirrel .nupkg"
          }

          $releaseText = Get-Content -LiteralPath $releaseIndexes[0].FullName -Raw
          foreach ($fullPackage in $fullPackages) {
            if ($releaseText -notmatch [regex]::Escape($fullPackage.Name)) {
              throw "RELEASES does not reference full package $($fullPackage.Name)"
            }
          }
          Write-Host "Validated Setup.exe, RELEASES, and $($fullPackages.Count) full .nupkg file(s)."

      - name: Publish (or dry-run)
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — payload and installer verified; packing without publishing"
            npm pack --dry-run --ignore-scripts
          else
            npm publish --ignore-scripts --tag "$NPM_DIST_TAG" --access public
          fi

      # Confirm the registry actually has the new version (real publishes only).
      - name: Post-publish registry smoke
        if: ${{ inputs.dry-run != true }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if VERSION=$(npm view "@bitkyc08/opencodex@${RELEASE_VERSION}" version 2>/dev/null); then
              echo "registry version=$VERSION"
              test "$VERSION" = "$RELEASE_VERSION"
              npm dist-tag ls @bitkyc08/opencodex
              exit 0
            fi
            echo "::notice::@bitkyc08/opencodex@${RELEASE_VERSION} not visible in npm registry yet (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::npm registry smoke failed after 30 attempts"
          npm view @bitkyc08/opencodex versions dist-tags --json || true
          exit 1

      - name: Create GitHub release
        if: ${{ inputs.dry-run != true }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          release_tag="v${RELEASE_VERSION}"

          git fetch --force --tags origin

          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::${release_tag} already points at ${existing_tag_sha}, not ${GITHUB_SHA}"
            exit 1
          fi

          # Channel previous tag for Full Changelog + default notes baseline.
          # Preview baselines any prior release; stable baselines prior stable only.
          previous_tag="$(
            git tag --merged HEAD --list 'v[0-9]*' |
              bun scripts/release-notes.ts previous-release-tag "$RELEASE_VERSION"
          )"
          npm_metadata="Published to npm as \`@bitkyc08/opencodex@${RELEASE_VERSION}\` with dist-tag \`${NPM_DIST_TAG}\`. The attached Squirrel.Windows Setup.exe and update feed are unsigned; Windows may show an Unknown Publisher or SmartScreen warning."

          # Preview builds must be marked prerelease so GitHub "latest" keeps pointing at the
          # stable channel (matching npm dist-tags); see issue #64.
          prerelease_flag=""
          if [[ "$RELEASE_VERSION" == *-preview.* ]]; then
            prerelease_flag="--prerelease"
          fi

          # Build notes before tagging: if generate-notes fails after a tag push, preflight
          # blocks retries because the tag already exists. API uses target_commitish, so the
          # tag need not exist yet. Preflight already rejects an existing GitHub Release for
          # non-dry runs, so this step only creates.
          notes_file="$(mktemp)"
          carried_file="$(mktemp)"
          delta_file="$(mktemp)"
          commits_file="$(mktemp)"
          : > "$carried_file"
          : > "$delta_file"
          : > "$commits_file"

          # Stable releases after matching previews: aggregate every matching preview
          # changelog (oldest→newest; each preview body is incremental), then only
          # generate-notes / commits for the post-preview delta when the newest
          # *successfully carried* preview tag is an ancestor of this commit. Never
          # advance the baseline to a later preview that is missing/empty — that would
          # drop the gap between the last carried preview and that later tag.
          notes_range_start="$previous_tag"
          if [[ "$RELEASE_VERSION" != *-preview.* ]]; then
            preview_carry_tags="$(
              git tag --list "v${RELEASE_VERSION}-preview.*" |
                bun scripts/release-notes.ts matching-preview-tags "$RELEASE_VERSION"
            )"
            newest_carried_preview_tag=""
            carried_part_files=()
            # Probe repo readability once so a token/permission 404 cannot be
            # mistaken for "this preview tag has no release".
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name' > /dev/null
            view_err="$(mktemp)"
            while IFS= read -r preview_carry_tag; do
              [ -n "$preview_carry_tag" ] || continue
              : > "$view_err"
              set +e
              # Prefer HTTP status over stderr prose: auth failures also say "Not Found".
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${preview_carry_tag}" \
                --jq '.body' > "${carried_file}.raw" 2>"$view_err"
              view_status=$?
              set -e
              if [ "$view_status" -eq 0 ]; then
                bun scripts/release-notes.ts strip-carried "${carried_file}.raw" > "${carried_file}.one"
                if bun scripts/release-notes.ts has-meaningful "${carried_file}.one"; then
                  part_file="${carried_file}.part.${#carried_part_files[@]}"
                  cp "${carried_file}.one" "$part_file"
                  carried_part_files+=("$part_file")
                  newest_carried_preview_tag="$preview_carry_tag"
                  echo "::notice::Carrying preview release notes from ${preview_carry_tag} into ${release_tag}"
                else
                  echo "::notice::Preview release ${preview_carry_tag} has no usable changelog after strip; leaving carried baseline unchanged for this tag"
                fi
              elif grep -qE 'HTTP 404' "$view_err"; then
                echo "::notice::Matching preview tag ${preview_carry_tag} has no GitHub Release; skipping"
              else
                echo "::error::Failed to look up GitHub Release for ${preview_carry_tag} (operational error, not a missing release)"
                cat "$view_err" >&2 || true
                exit 1
              fi
            done <<< "$preview_carry_tags"

            if [ "${#carried_part_files[@]}" -gt 0 ]; then
              bun scripts/release-notes.ts join-carried --out "$carried_file" "${carried_part_files[@]}"
            fi

            if [ -n "$newest_carried_preview_tag" ]; then
              if git merge-base --is-ancestor "$newest_carried_preview_tag" "$GITHUB_SHA"; then
                notes_range_start="$newest_carried_preview_tag"
                echo "::notice::Using preview tag ${newest_carried_preview_tag} as notes/commits baseline (ancestor of ${GITHUB_SHA})"
              else
                echo "::notice::Preview tag ${newest_carried_preview_tag} is not an ancestor of ${GITHUB_SHA}; keeping channel baseline ${previous_tag:-none} for generate-notes/commits"
              fi
            fi
          fi

          if [ -n "$notes_range_start" ]; then
            generate_notes_api=(
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
              -f "tag_name=${release_tag}"
              -f "target_commitish=${GITHUB_SHA}"
              -f "previous_tag_name=${notes_range_start}"
            )
            # Fail closed: missing PR categories is a broken release note, not a soft skip.
            pr_notes="$(gh api "${generate_notes_api[@]}" --jq '.body')"
            # Drop generate-notes' trailing compare link; we re-append it after the commit list.
            printf '%s\n' "$pr_notes" | sed '/^\*\*Full Changelog\*\*:/d' > "$delta_file"
          else
            # First release on this channel: never call generate-notes without previous_tag_name.
            # GitHub would baseline the newest repo tag, which may belong to the other channel.
            echo "::notice::No previous channel tag; skipping generate-notes (commits-only notes)"
          fi

          if [ -n "$notes_range_start" ]; then
            commit_range="${notes_range_start}..${GITHUB_SHA}"
            git log --pretty=format:'- %s (%h)' "$commit_range" > "$commits_file"
          else
            # First release on a channel has no previous tag; cap history so the notes
            # body stays within GitHub release size limits.
            git log --pretty=format:'- %s (%h)' --max-count=100 "$GITHUB_SHA" > "$commits_file"
          fi
          # `--pretty=format:` omits the trailing newline; normalize for downstream readers.
          if [ -s "$commits_file" ]; then
            printf '\n' >> "$commits_file"
          fi

          assemble_args=(
            bun scripts/release-notes.ts assemble
            --npm-metadata "$npm_metadata"
            --carried "$carried_file"
            --delta "$delta_file"
            --commits "$commits_file"
            --out "$notes_file"
            --compare-to "$release_tag"
            --repository "$GITHUB_REPOSITORY"
          )
          # Prefer the stable-channel previous tag for the compare link when present.
          if [ -n "$previous_tag" ]; then
            assemble_args+=(--compare-from "$previous_tag")
          elif [ -n "$notes_range_start" ]; then
            assemble_args+=(--compare-from "$notes_range_start")
          fi
          "${assemble_args[@]}"

          lines="$(bun run scripts/count-lines.ts)"
          dish_title=""
          dish_section=""
          if [ "$DISH_AVAILABLE" = "true" ]; then
            dish_title=" · $DISH_NAME · $DISH_ZH"
            dish_section=$(cat <<DISH

          ### 🥟 $DISH_NAME · $DISH_ZH

          [View the published public-catalog photo for $DISH_NAME · $DISH_ZH]($DISH_PHOTO)

          Public catalog asset: \`$DISH_RELEASE_TAG/$DISH_ID\`. This release links the public photo and does not attach a copied image.
          DISH
            )
          else
            echo "::warning::Publishing without a dim-sum codename because no unused published public asset was resolved."
          fi
          workflow_started="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)"
          if [ -z "$workflow_started" ]; then
            echo "::error::Workflow start time is unavailable; refusing to publish incomplete timing evidence."
            exit 1
          fi
          cat >> "$notes_file" <<NOTES

          $dish_section

          <details>
          <summary>📏 <strong>Lines of code at this commit</strong></summary>

          $lines

          Produced by this run with \`bun run scripts/count-lines.ts\` over \`${GITHUB_SHA:0:9}\`.

          </details>

          Workflow timing is finalized immediately after release publication.
          NOTES

          if [ -z "$existing_tag_sha" ]; then
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/${release_tag}"
          fi

          mapfile -t setup_assets < <(find dist-desktop -type f -name '*Setup*.exe' -size +0c -print)
          mapfile -t releases_assets < <(find dist-desktop -type f -name RELEASES -size +0c -print)
          mapfile -t nupkg_assets < <(find dist-desktop -type f -name '*.nupkg' -size +0c -print)
          mapfile -t full_nupkg_assets < <(find dist-desktop -type f -name '*-full.nupkg' -size +0c -print)

          if [ "${#setup_assets[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Setup.exe before release creation; found ${#setup_assets[@]}."
            exit 1
          fi
          if [ "${#releases_assets[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one RELEASES index before release creation; found ${#releases_assets[@]}."
            exit 1
          fi
          if [ "${#full_nupkg_assets[@]}" -lt 1 ]; then
            echo "::error::No full Squirrel .nupkg exists; refusing to publish an incomplete update feed."
            exit 1
          fi

          gh release create "$release_tag" --target "$GITHUB_SHA" --title "$release_tag$dish_title" \
            --notes-file "$notes_file" ${prerelease_flag:+$prerelease_flag} \
            "${setup_assets[0]}#Setup.exe" \
            "${releases_assets[0]}#RELEASES" \
            "${nupkg_assets[@]}"

          workflow_completed="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          workflow_duration="$(node -e 'const start=Date.parse(process.argv[1]); const end=Date.parse(process.argv[2]); if(!Number.isFinite(start)||!Number.isFinite(end)||end<start) process.exit(2); const seconds=Math.floor((end-start)/1000); const h=String(Math.floor(seconds/3600)).padStart(2,"0"); const m=String(Math.floor((seconds%3600)/60)).padStart(2,"0"); const s=String(seconds%60).padStart(2,"0"); process.stdout.write(`${h}:${m}:${s}`);' "$workflow_started" "$workflow_completed")"
          cat >> "$notes_file" <<NOTES

          | Workflow timing | UTC |
          | --- | --- |
          | Workflow started | \`$workflow_started\` |
          | Workflow completed | \`$workflow_completed\` |
          | Workflow duration | \`$workflow_duration\` |
          NOTES
          gh release edit "$release_tag" --notes-file "$notes_file"

          release_readback="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq '[.draft,.target_commitish,.tag_name] | @tsv')"
          IFS=$'\t' read -r release_is_draft release_target release_tag_readback <<< "$release_readback"
          if [ "$release_is_draft" != "false" ] || [ "$release_target" != "$GITHUB_SHA" ] || [ "$release_tag_readback" != "$release_tag" ]; then
            echo "::error::Published release readback did not match the unique non-draft exact-SHA contract"
            exit 1
          fi

      # Keep installable packages, build output, and failure metadata available
      # even when a publish or release step fails. Only known output locations
      # are copied; credentials, dependencies, caches, and source are excluded.
      - name: Collect release artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          @(
            "workflow=$env:GITHUB_WORKFLOW"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "sha=$env:GITHUB_SHA"
            "job_status=$env:JOB_STATUS"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
          ) | Set-Content -LiteralPath (Join-Path $artifactRoot "run-metadata.txt") -Encoding utf8

          $safeCount = 0
          $installerRoot = Join-Path $env:GITHUB_WORKSPACE "dist-desktop"
          if (Test-Path -LiteralPath $installerRoot -PathType Container) {
            Get-ChildItem -LiteralPath $installerRoot -Recurse -File | Where-Object {
              $_.Name -eq "RELEASES" -or $_.Extension -in @(".exe", ".nupkg")
            } | ForEach-Object {
              $relative = $_.FullName.Substring($installerRoot.Length).TrimStart([char]"\", [char]"/")
              $destination = Join-Path (Join-Path $artifactRoot "squirrel-windows") $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
              $safeCount++
            }
          }

          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -eq "pack.json" -or $_.Name -like "*.tgz"
          } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $artifactRoot -Force
            $safeCount++
          }

          if ($safeCount -eq 0) {
            "No safe installer, update-feed, or npm package output was produced." |
              Set-Content -LiteralPath (Join-Path $artifactRoot "NO_SAFE_ARTIFACTS.txt") -Encoding utf8
          }

      - name: Upload release artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ github.run_id }}
          path: release-artifacts
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
